<button type="button" class="card-icon-btn card-wish" data-toggle-wish data-slug="{{ product.slug }}" data-name="{{ product.name }}" data-image="{{ product.image_url }}" data-url="{{ product.get_absolute_url }}" data-category="{{ product.category.nav_label }}" aria-label="Save {{ product.name }} to wishlist"><i class="fa-regular fa-heart"></i></button>
