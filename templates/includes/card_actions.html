<div class="card-actions">
  <div class="qty-stepper card-qty">
    <button type="button" data-card-step="-1" aria-label="Decrease quantity" {% if product.available_units < 1 %}disabled{% endif %}>−</button>
    <input type="text" inputmode="numeric" value="1" data-card-qty aria-label="Quantity for {{ product.name }}" {% if product.available_units < 1 %}disabled{% endif %}>
    <button type="button" data-card-step="1" aria-label="Increase quantity" {% if product.available_units < 1 %}disabled{% endif %}>+</button>
  </div>
  <button type="button" class="card-action-link card-cart-btn" data-add-cart data-slug="{{ product.slug }}" data-name="{{ product.name }}" data-image="{{ product.image_url }}" data-url="{{ product.get_absolute_url }}" data-category="{{ product.category.nav_label }}" {% if product.available_units < 1 %}disabled{% endif %}>Add to cart</button>
  <a class="card-action-link card-view-link" href="{{ product.get_absolute_url }}">View details</a>
</div>
